# Production stack for the labeling tool: the app + Caddy (HTTPS + password) in front.
#
#   cp deploy/app.env.example deploy/app.env       # then fill in, chmod 600
#   cp deploy/caddy.env.example deploy/caddy.env   # then fill in, chmod 600
#   docker compose up -d --build
#
# Only Caddy publishes ports. Docker writes its own firewall rules for published
# ports and they BYPASS ufw, so the app must never get a `ports:` entry.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: deploy/app.env          # OPENROUTER_API_KEY (+ optional SUGGEST_MODEL)
    volumes:
      - labels-data:/data             # labels.db lives here, survives rebuilds
    # no ports: reachable only as http://app:8765 from containers on this network

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: deploy/caddy.env        # LABELS_DOMAIN, BASIC_AUTH_USER, BASIC_AUTH_HASH
    ports:
      - "80:80"                       # HTTP: certificate challenge + redirect to HTTPS
      - "443:443"                     # HTTPS
      - "443:443/udp"                 # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # TLS certificates: keep them, or Let's Encrypt rate-limits you
      - caddy-config:/config

volumes:
  labels-data:
  caddy-data:
  caddy-config:

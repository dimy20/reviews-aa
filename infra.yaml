image: enzost4/kev:1.0
network_volume_id: ibyodt24ki
data_center: EU-RO-1
port: 8000
devices:
  - NVIDIA RTX A4500
  - NVIDIA RTX 4000 Ada Generation
  - NVIDIA RTX 2000 Ada Generation
  - NVIDIA RTX A4000
  - NVIDIA RTX PRO 4000 Blackwell
  - NVIDIA L4
  - NVIDIA GeForce RTX 4090
max_attempts: 20
wait_interval: 30
# kev fine-tuneado, publicado en Hugging Face 
# y queda cacheado en el network volume (HF_HOME=/runpod-volume/huggingface)

run: enzost98/kev-reviews@v1
#run: /runpod-volume/fine-tuned-reviews -> la misma carpeta copiada a mano al volume
#run: jaredpalmer/kev-4b@v1.0 -> este es kev base

# nginx del dashboard: sirve los archivos estáticos y reenvía /api/ a la API.
# Así el navegador le habla a un solo origen, y un túnel (ngrok) al dashboard alcanza
# para que funcione todo desde afuera.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El navegador puede guardar los archivos, pero tiene que preguntar si cambiaron antes de
    # usarlos (responde 304 si no). Sin esto, después de un deploy se queda con el JS viejo.
    add_header Cache-Control "no-cache";

    # La dirección pública del túnel, para el código QR (js/qr.js). Se resuelve en cada pedido
    # y no al arrancar: así nginx levanta igual aunque el servicio ngrok no esté corriendo.
    location = /public-url {
        resolver 127.0.0.11 valid=10s;
        set $ngrok http://ngrok:4040;
        proxy_pass $ngrok/api/tunnels;
    }

    # /api/reviews/ y /api/reviews/analyze -> http://api:8000/reviews/...  ("api" es el servicio
    # de compose). Solo esas dos rutas: /docs y el resto de la API no salen por el túnel.
    location /api/reviews {
        proxy_pass http://api:8000/reviews;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

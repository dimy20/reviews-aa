<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumen · RestoAnalytics</title>
  <meta name="description" content="Las reseñas del restaurante, una por una, con lo que marca cada aspecto.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%231F1E1C'/><path d='M4.5 12V9M8 12V5M11.5 12V7.5' stroke='%23C7894B' stroke-width='1.8' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>Análisis de reseñas</h1>
      </div>
      <div class="sync" id="sync" role="status"></div>
    </header>

    <section class="filters" id="filters" aria-label="Filtros"></section>

    <div id="content">
      <section class="row-top">
        <article class="card viewer" id="viewer" aria-label="Reseña por reseña"></article>
        <div class="side-stack">
          <div class="card kpi" id="kpi-count"></div>
          <div class="dark-card fix" id="fix">
            <div class="fix-body" id="fix-body"></div>
            <div class="dark-img" aria-hidden="true">
              <img src="img/brownie-plato.webp" alt="">
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="aspectos">
        <div class="section-head">
          <h2>Desempeño por aspecto</h2>
          <p class="muted small">Promedio de 1 a 5 entre las reseñas que mencionan cada aspecto. Elegí uno para ver sus reseñas.</p>
        </div>
        <div class="aspects" id="aspects"></div>
      </section>
    </div>

    <section class="card empty-state" id="empty" hidden>
      <h2>No hay reseñas para estos filtros</h2>
      <p class="muted">Ampliá el período o quitá algún filtro.</p>
    </section>
  </main>

  <script type="module" src="js/resumen.js"></script>
</body>
</html>

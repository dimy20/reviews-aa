# Reviews API + dashboard. Separate from compose.yaml (the labeling tool).
#
#   docker compose -f compose.app.yaml up -d --build
#   docker compose -f compose.app.yaml up --build --watch   # dev: code changes reach the running containers
#
#   dashboard: http://localhost:8080
#   api:       http://localhost:8000/docs
#   public:    docker compose -f compose.app.yaml logs ngrok | grep -o 'url=.*'
#
# Ports are bound to 127.0.0.1 only: Docker's published ports bypass ufw.

name: reviews-app  # own project name, so it never touches the compose.yaml stack

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env                    # RUNPOD_API_KEY, KEV_API_KEY, OPENROUTER_API_KEY, HF_TOKEN
    environment:
      REVIEWS_DB_PATH: /data/reviews.db
      # minutes without reviews before the kev pod is deleted (from .env or the shell)
      MAX_POD_INACTIVITY_MINUTES: ${MAX_POD_INACTIVITY_MINUTES:-10}
    volumes:
      - api-data:/data                # reviews.db, survives rebuilds
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    develop:
      watch:
        # Python code: copy into the container and restart uvicorn (a few seconds).
        - path: ./api
          target: /app/api
          action: sync+restart
          ignore: [reviews.db, Dockerfile]
        - path: ./engine
          target: /app/engine
          action: sync+restart
        - path: ./settings.py
          target: /app/settings.py
          action: sync+restart
        - path: ./infra.yaml
          target: /app/infra.yaml
          action: sync+restart
        # Dependencies or the image itself changed: rebuild.
        - path: ./pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild
        - path: ./api/Dockerfile
          action: rebuild

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Called from the browser. /api is served by this same nginx, which forwards it to
      # the api service (dashboard/docker/default.conf): it works from localhost and
      # through the ngrok tunnel alike.
      API_BASE: ${API_BASE:-/api}
      # Public address of the dashboard, used by the form's QR code. Empty = the address the
      # dashboard was opened with (open it through the ngrok URL and the QR is right).
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:80"
    develop:
      watch:
        # Static files: nginx serves them as soon as they're copied, just refresh the browser.
        - path: ./dashboard
          target: /usr/share/nginx/html
          action: sync
          # js/env.js is generated in the container from API_BASE: syncing the local
          # (empty) one would switch the dashboard to demo mode.
          ignore: [js/env.js, Dockerfile, docker/, scripts/, README.md]
        - path: ./dashboard/Dockerfile
          action: rebuild
        - path: ./dashboard/docker
          action: rebuild

  # Public URL for the dashboard (and the API, through /api). The address is in the logs:
  #   docker compose -f compose.app.yaml logs ngrok | grep -o 'url=.*'
  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    depends_on: [dashboard]
    command: http dashboard:80 --config /etc/ngrok.yml --config /etc/ngrok-web.yml --log stdout
    volumes:
      # the authtoken from the machine's own ngrok install, read-only (never copied into .env)
      - ${HOME}/.config/ngrok/ngrok.yml:/etc/ngrok.yml:ro
      # lets the dashboard ask the agent for the public address (for the QR code)
      - ./deploy/ngrok/web.yml:/etc/ngrok-web.yml:ro

volumes:
  api-data:
